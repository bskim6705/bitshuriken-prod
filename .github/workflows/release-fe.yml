name: release-fe

# Monorepo: builds only when the frontend directory (or this workflow) changes.
# NEXT_PUBLIC_* are baked into the image at build time, sourced from repository
# variables (Settings -> Secrets and variables -> Actions -> Variables).
on:
  push:
    branches: [main]
    paths:
      - "bitshuriken-prod-fe/**"
      - ".github/workflows/release-fe.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitshuriken-prod-fe
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./bitshuriken-prod-fe
          file: ./bitshuriken-prod-fe/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FUTURES_API_URL=${{ vars.NEXT_PUBLIC_FUTURES_API_URL }}
            NEXT_PUBLIC_PORTAL_API_URL=${{ vars.NEXT_PUBLIC_PORTAL_API_URL }}
            NEXT_PUBLIC_RATE_LIMIT_ENABLED=${{ vars.NEXT_PUBLIC_RATE_LIMIT_ENABLED || 'false' }}
