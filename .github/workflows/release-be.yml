name: release-be

# Monorepo: builds only when the backend directory (or this workflow) changes.
# Image name matches bitshuriken-prod-infra/docker-compose.prod.yml.
on:
  push:
    branches: [main]
    paths:
      - "bitshuriken-prod-be/**"
      - ".github/workflows/release-be.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitshuriken-prod-be
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ./bitshuriken-prod-be
          file: ./bitshuriken-prod-be/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be
