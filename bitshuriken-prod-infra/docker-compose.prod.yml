name: bitshuriken-prod

# Prod stack for a single Linux host (amd64). Images are built by each app repo's
# GitHub Actions and pushed to GHCR; this host only pulls + runs (see deploy.sh).
#
# Topology behind Cloudflare -> nginx (same-origin /api path routing):
#   <DOMAIN>/        -> fe
#   <DOMAIN>/api/*   -> nginx strips /api, routes /spot|/futures|/ws segments to
#                       those apps; everything else -> portal
#
# Only nginx publishes host ports (80/443). Everything else is internal-only.

x-be-image: &be-image ghcr.io/bskim6705/bitshuriken-prod-be:latest
x-be-base: &be-base
  image: *be-image
  env_file: .env.prod
  restart: unless-stopped
  networks: [internal]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (fixed bucket partitions P + compaction) by kafka-init.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
    networks: [internal]

  # One-shot: create match.{spot,futures}.{in,out,book,state,control} with P fixed bucket
  # partitions (symbols hashed FNV-1a%P). state/control are log-compacted; control=1 partition.
  kafka-init:
    image: apache/kafka:3.8.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MATCH_SPOT_PARTITIONS: ${MATCH_SPOT_PARTITIONS}
      MATCH_FUTURES_PARTITIONS: ${MATCH_FUTURES_PARTITIONS}
    entrypoint: ["/bin/bash", "/init/kafka-init.sh"]
    volumes:
      - ./scripts/kafka-init.sh:/init/kafka-init.sh:ro
    networks: [internal]

  # ---- Backend (one image, three processes) ----
  be-migrate:
    <<: *be-base
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  be-spot:
    <<: *be-base
    command: ["node", "dist/apps/spot/main"]
    depends_on:
      be-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  be-futures:
    <<: *be-base
    command: ["node", "dist/apps/futures/main"]
    depends_on:
      be-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  be-portal:
    <<: *be-base
    command: ["node", "dist/apps/portal/main"]
    depends_on:
      be-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully  # admin ticker 생성이 control 토픽 produce

  # ---- Matching engine (Python) — split per market ----
  match-spot:
    image: ghcr.io/bskim6705/bitshuriken-prod-match:latest
    restart: unless-stopped
    environment:
      KAFKA_BROKER: kafka:9092
      MATCH_CONFIG_PATH: config/tickers-spot.json
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [internal]

  match-futures:
    image: ghcr.io/bskim6705/bitshuriken-prod-match:latest
    restart: unless-stopped
    environment:
      KAFKA_BROKER: kafka:9092
      MATCH_CONFIG_PATH: config/tickers-futures.json
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks: [internal]

  # ---- Frontend (Next.js standalone; NEXT_PUBLIC_* baked at build) ----
  fe:
    image: ghcr.io/bskim6705/bitshuriken-prod-fe:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks: [internal]

  # ---- Reverse proxy (behind Cloudflare; TLS = Cloudflare Origin cert) ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/bitshuriken.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro  # host: origin.pem + origin.key
    depends_on:
      - fe
      - be-spot
      - be-futures
      - be-portal
    networks: [internal]

networks:
  internal:
    name: bitshuriken_internal

volumes:
  pgdata:
  kafkadata:
