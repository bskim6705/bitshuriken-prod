# bitshuriken origin behind Cloudflare. Same-origin routing:
#   /          -> fe (Next.js)
#   /api/*     -> backend, "/api" prefix STRIPPED (apps serve bare /spot, /auth, /ws/market...)
#   /api/ws/*  -> spot/futures WebSocket gateways
#
# TLS = Cloudflare Origin certificate (set CF SSL/TLS mode to "Full (strict)").
# Real client IP comes from CF-Connecting-IP — see cloudflare-realip.conf.

# WebSocket upgrade — empty Upgrade header => "close" (harmless for plain HTTP).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bitshuriken.com www.bitshuriken.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bitshuriken.com www.bitshuriken.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # docker 임베디드 DNS — 백엔드 컨테이너 재배포(새 IP) 후에도 요청 시점에 재해석.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 2m;
    gzip on;
    gzip_types application/json application/javascript text/css;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- spot ----
    location ~ ^/api(/spot/.*)$ {
        set $u be-spot:5101;
        proxy_pass http://$u$1$is_args$args;
    }
    location ~ ^/api(/ws/(market|user))$ {
        set $u be-spot:5101;
        proxy_pass http://$u$1$is_args$args;
        proxy_read_timeout 3600s;
    }

    # ---- futures ----
    location ~ ^/api(/futures/.*)$ {
        set $u be-futures:5102;
        proxy_pass http://$u$1$is_args$args;
    }
    location ~ ^/api(/ws/(fmarket|fuser))$ {
        set $u be-futures:5102;
        proxy_pass http://$u$1$is_args$args;
        proxy_read_timeout 3600s;
    }

    # ---- everything else under /api -> portal (auth/account/admin/leaderboard/subaccounts) ----
    location ~ ^/api(/.*)$ {
        set $u be-portal:5103;
        proxy_pass http://$u$1$is_args$args;
    }

    # ---- everything not /api -> the Next.js frontend ----
    location / {
        set $u fe:3000;
        proxy_pass http://$u;
    }
}
